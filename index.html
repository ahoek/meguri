<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Create beautiful walking and cycling loops of exactly the length you want." />
    <meta name="theme-color" content="#0c111b" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
    <!-- The one subset every supported language needs. Declared in the app's
         own stylesheet, which the browser would not have parsed yet; this
         starts the fetch alongside it instead of a round trip behind it. The
         latin-ext subset is deliberately not preloaded — it is for the odd
         foreign place name, and most visits never touch it. -->
    <link
      rel="preload"
      href="%BASE_URL%fonts/outfit-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Meguri — round-trip route maker</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
